name: Deploy Rayhaan Notice Board

on:
  push:
    branches: [master]
    paths:
      - "workshops/fullstack-aws/projects/g4_rayhaan_ricky_santosh_shehzeen_taran_SRTRS/02-notice-board/**"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_DIR: workshops/fullstack-aws/projects/g4_rayhaan_ricky_santosh_shehzeen_taran_SRTRS/02-notice-board

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Lambda zip
        working-directory: ${{ env.PROJECT_DIR }}
        run: python build.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name "${{ secrets.LAMBDA_FUNCTION_NAME }}" \
            --zip-file fileb://${{ env.PROJECT_DIR }}/backend/lambda.zip

      - name: Wait for Lambda update to finish
        run: |
          aws lambda wait function-updated \
            --function-name "${{ secrets.LAMBDA_FUNCTION_NAME }}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ env.PROJECT_DIR }}/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ${{ env.PROJECT_DIR }}/frontend
        run: npm install

      - name: Build frontend
        working-directory: ${{ env.PROJECT_DIR }}/frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Sync frontend to S3
        run: |
          aws s3 sync ${{ env.PROJECT_DIR }}/frontend/dist "s3://${{ secrets.S3_BUCKET }}" --delete

      # Tier 3: uncomment once you've added the CLOUDFRONT_DISTRIBUTION_ID secret
