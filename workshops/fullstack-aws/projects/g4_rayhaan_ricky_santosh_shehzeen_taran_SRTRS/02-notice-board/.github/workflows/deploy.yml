name: Deploy Notice Board

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # Backend: package + deploy the Lambda
      # -----------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Lambda zip
        run: python build.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name "${{ secrets.LAMBDA_FUNCTION_NAME }}" \
            --zip-file fileb://backend/lambda.zip

      - name: Wait for Lambda update to finish
        run: |
          aws lambda wait function-updated \
            --function-name "${{ secrets.LAMBDA_FUNCTION_NAME }}"

      # -----------------------------------------------------------------
      # Frontend: build + upload to S3
      # -----------------------------------------------------------------
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Sync frontend to S3
        run: |
          aws s3 sync frontend/dist "s3://${{ secrets.S3_BUCKET }}" --delete

      # -----------------------------------------------------------------
      # Tier 3: invalidate the CloudFront cache so the new build is served
      # immediately instead of waiting for the old cached files to expire.
      #
      # This step is a no-op until you've completed Tier 3 and added the
      # CLOUDFRONT_DISTRIBUTION_ID secret (see below) - uncomment it then.
      # -----------------------------------------------------------------
      # - name: Invalidate CloudFront cache
      #   run: |
      #     aws cloudfront create-invalidation \
      #       --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
      #       --paths "/*"