services:
  postgres:
    image: postgres:16
    container_name: noticeboard-local-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: noticeboard
      POSTGRES_USER: noticeboard_app
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - noticeboard_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noticeboard_app -d noticeboard"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  noticeboard_pg_data:
