name: Deploy Group4 Notice Board

on:
  push:
    # master, NOT main. Your fork's default branch. A trigger on a branch that does not
    # exist fails silently - the Actions tab simply stays empty.
    branches: [master]
    # Without this filter, editing ANY file in this monorepo would redeploy your app.
    # The fork carries every other project in the workshop.
    paths:
      - 'workshops/fullstack-aws/projects/group4_rickyjiang_santoshnukala_rayhaanmohamed_shehzeensyed_tarangunta/**'
      - '.github/workflows/deploy-group4-notice-board.yml'
  # Adds a manual "Run workflow" button - invaluable for redeploying without inventing
  # a commit.
  workflow_dispatch:

# Read-only repo token. The default is often broader; narrowing it is free.
permissions:
  contents: read

# Never let two deploys race. Push twice quickly and the second cancels the first,
# instead of interleaving and uploading mismatched frontend/backend.
concurrency:
  group: deploy-group4-notice-board
  cancel-in-progress: true

env:
  # Every step references this. One place to fix if the path ever changes.
  PROJECT_DIR: workshops/fullstack-aws/projects/group4_rickyjiang_santoshnukala_rayhaanmohamed_shehzeensyed_tarangunta/02-notice-board

jobs:

  # ---------------------------------------------------------------------
  # 1. TEST - the gate. Nothing deploys if the suite is red.
  # ---------------------------------------------------------------------
  test:
    name: Run backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run pytest
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          # REPOSITORY=memory means the suite never touches Atlas - no network, no
          # credentials, and CI cannot corrupt real data.
          REPOSITORY: memory
          # A dummy signing key. A CI test run must never hold the real one.
          JWT_SECRET: ci-test-secret-not-used-in-production-0123456789
          JWT_EXPIRATION_MINUTES: '60'
        run: pytest backend/tests -q

  # ---------------------------------------------------------------------
  # 2. BACKEND - build the Linux zip and push it to Lambda
  # ---------------------------------------------------------------------
  deploy-backend:
    name: Deploy Lambda
    runs-on: ubuntu-latest
    needs: test            # the gate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build Lambda package
        working-directory: ${{ env.PROJECT_DIR }}
        # build.py pins --platform manylinux2014_x86_64 --python-version 3.13, so it
        # produces an identical package on this Ubuntu runner and on your Windows
        # laptop. That reproducibility is the whole point of those flags.
        run: python build.py

      - name: Verify the package
        working-directory: ${{ env.PROJECT_DIR }}
        # A cheap gate. If the build silently produced the wrong shape, fail HERE with
        # a clear message rather than shipping a Lambda that 500s on every request.
        run: |
          python - <<'EOF'
          import sys, zipfile
          n = zipfile.ZipFile('backend/lambda.zip').namelist()
          checks = {
              'handler at root': 'lambda_function.py' in n,
              'app package': 'app/main.py' in n,
              'linux binaries': any(x.endswith('.so') for x in n),
              'dnspython': any(x.startswith('dns/') for x in n),
          }
          for k, v in checks.items():
              print(f'{k}: {v}')
          if not all(checks.values()):
              sys.exit('Lambda package is malformed')
          EOF

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update Lambda function code
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://backend/lambda.zip \
            --publish

      - name: Wait for the update to finish
        # update-function-code returns immediately; the function is briefly "InProgress"
        # and rejects further updates. Without this wait a fast follow-up push fails
        # with ResourceConflictException.
        run: |
          aws lambda wait function-updated \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }}

      - name: Smoke-test the deployed API
        # Proves the new code actually cold-starts. A deploy that "succeeded" but broke
        # the handler is worse than a failed deploy, because nothing tells you.
        run: |
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              "${{ secrets.VITE_API_URL }}/api/health")
            echo "Attempt $i -> HTTP $CODE"
            if [ "$CODE" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::Health check never returned 200 after deploy"
          exit 1

  # ---------------------------------------------------------------------
  # 3. FRONTEND - build with the API URL baked in, sync to S3
  # ---------------------------------------------------------------------
  deploy-frontend:
    name: Deploy frontend
    runs-on: ubuntu-latest
    # Waits for the backend so a new UI never hits an old API. Slightly slower, much
    # safer - and it is the ordering you would defend in a review.
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.PROJECT_DIR }}/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}/frontend
        # npm ci, not npm install: installs exactly what package-lock.json pins, so CI
        # can never quietly resolve a different transitive version than your laptop did.
        run: npm ci

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}/frontend
        env:
          # THE line that makes the deployed site talk to the right API. Vite
          # substitutes this at BUILD time - it cannot be changed afterwards without
          # rebuilding.
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Verify the API URL was baked in
        working-directory: ${{ env.PROJECT_DIR }}/frontend
        run: |
          grep -q "execute-api" dist/assets/*.js \
            || (echo "::error::VITE_API_URL missing from bundle - site would call localhost" && exit 1)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3
        working-directory: ${{ env.PROJECT_DIR }}/frontend
        run: |
          # Hashed assets first, cached hard - their filenames change whenever content
          # changes, so a year-long cache is safe.
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET }}/ \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

          # index.html LAST and uncached. It is the pointer to the hashed filenames, so
          # it must be re-fetched every time. Uploading it last also means the new
          # assets are already in place when the pointer flips - no window where
          # index.html references files that are not there yet.
          aws s3 cp dist/index.html s3://${{ secrets.S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CF_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          echo "Created invalidation $INVALIDATION_ID"

          # Block until the edges have actually purged. Without this the workflow goes
          # green while users are still served the old bundle for another minute - which
          # looks exactly like "my deploy did not work".
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ secrets.CF_DISTRIBUTION_ID }} \
            --id "$INVALIDATION_ID"
          echo "Invalidation complete"

      - name: Summary
        run: |
          echo "### Deployed :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- API: ${{ secrets.VITE_API_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- Site: http://${{ secrets.S3_BUCKET }}.s3-website-${{ secrets.AWS_REGION }}.amazonaws.com" >> $GITHUB_STEP_SUMMARY
          