name: Deploy Group2 Notice Board

on:
  push:
    branches: [master]
    paths:
      - "workshops/fullstack-aws/projects/Group2_JooYoung_Katellyn_Kevin_Usman/**"
      - ".github/workflows/deploy-group2-notice-board.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: group2-notice-board-production
  cancel-in-progress: true

env:
  PROJECT_DIR: workshops/fullstack-aws/projects/Group2_JooYoung_Katellyn_Kevin_Usman

jobs:
  deploy:
    if: github.repository == 'LumpyTacos/workshops'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # No SSH keys, no open port 22 — the EC2 instance's IAM role has
      # AmazonSSMManagedInstanceCore, so a plain Run Command pulls the latest
      # code and restarts the systemd service.
      - name: Deploy backend via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Notice Board backend" \
            --parameters commands="[
              'cd /opt/app && git pull',
              'cd /opt/app/${{ env.PROJECT_DIR }}/backend && venv/bin/pip install -r requirements.txt -q',
              'systemctl restart noticeboard'
            ]" \
            --query "Command.CommandId" --output text)

          echo "Waiting on SSM command $COMMAND_ID..."
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "Status" --output text)
          if [ "$STATUS" != "Success" ]; then
            echo "Backend deploy failed with status: $STATUS"
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: ${{ env.PROJECT_DIR }}/frontend
        run: npm install

      - name: Build frontend
        working-directory: ${{ env.PROJECT_DIR }}/frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Deploy frontend
        working-directory: ${{ env.PROJECT_DIR }}/frontend
        run: aws s3 sync dist/ "s3://${{ secrets.S3_BUCKET }}/" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CF_DISTRIBUTION_ID }}" \
            --paths "/*"
