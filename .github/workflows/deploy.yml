name: SyncUp Deploy (student-ricky-jiang)

on:
  push:
    branches: [master]
    paths:
      - "workshops/fullstack-aws/projects/submission/ricky-jiang/noticeboard-syncup/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy backend via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/workshops
            git pull origin master
            cd workshops/fullstack-aws/projects/submission/ricky-jiang/noticeboard-syncup/backend
            if [ ! -d venv ]; then
              python3 -m venv venv
            fi
            source venv/bin/activate
            pip install -r requirements.txt
            sudo systemctl restart syncup-backend

      # Experimental - deploys the Lambda backend in parallel with the EC2
      # backend above. Additive only: if this step fails, it doesn't affect
      # the EC2/S3/CloudFront steps, which run independently. The live app's
      # VITE_API_URL still points at EC2 until a deliberate cutover decision.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Lambda zip
        working-directory: workshops/fullstack-aws/projects/submission/ricky-jiang/noticeboard-syncup/backend
        run: |
          pip install --upgrade pip
          python build.py

      - name: Deploy Lambda code
        working-directory: workshops/fullstack-aws/projects/submission/ricky-jiang/noticeboard-syncup/backend
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://lambda.zip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: workshops/fullstack-aws/projects/submission/ricky-jiang/noticeboard-syncup/frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          npm install
          npm run build

      - name: Upload frontend to S3
        working-directory: workshops/fullstack-aws/projects/submission/ricky-jiang/noticeboard-syncup/frontend
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET }}/ --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CF_DISTRIBUTION_ID }} \
            --paths "/*"
